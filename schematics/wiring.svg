<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="DejaVu Sans, Arial, sans-serif"><rect width="880" height="610" fill="#fff"/><text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold">ESP32 Bluetooth/SD Music Box - pin diagram (draft)</text><rect x="340" y="50" width="190" height="540" rx="8" fill="#e8f0ff" stroke="#333" stroke-width="1.5"/><text x="435.0" y="70" text-anchor="middle" font-weight="bold" font-size="14">ESP32 DevKit V1</text><text x="522" y="114" text-anchor="end" font-size="12" fill="#111">GPIO 2</text><text x="522" y="144" text-anchor="end" font-size="12" fill="#111">GPIO 4</text><text x="522" y="174" text-anchor="end" font-size="12" fill="#111">GPIO 18</text><text x="522" y="204" text-anchor="end" font-size="12" fill="#111">GPIO 23</text><text x="522" y="279" text-anchor="end" font-size="12" fill="#111">GPIO 17 (TX)</text><text x="522" y="309" text-anchor="end" font-size="12" fill="#111">GPIO 16 (RX)</text><text x="522" y="389" text-anchor="end" font-size="12" fill="#111">GPIO 32</text><text x="522" y="419" text-anchor="end" font-size="12" fill="#111">GPIO 33</text><text x="522" y="449" text-anchor="end" font-size="12" fill="#111">GPIO 25</text><text x="522" y="509" text-anchor="end" font-size="12" fill="#111">GPIO 26</text><text x="522" y="539" text-anchor="end" font-size="12" fill="#111">GPIO 27</text><text x="522" y="569" text-anchor="end" font-size="12" fill="#111">GPIO 14</text><rect x="20" y="58" width="230" height="168" rx="8" fill="#fff3e0" stroke="#333" stroke-width="1.5"/><text x="135.0" y="78" text-anchor="middle" font-weight="bold" font-size="14">ILI9341 2.8" TFT</text><text x="30" y="114" text-anchor="start" font-size="12" fill="#111">TFT DC</text><line x1="250" y1="110" x2="340" y2="110" stroke="#555" stroke-width="1.6"/><text x="30" y="144" text-anchor="start" font-size="12" fill="#111">TFT RST</text><line x1="250" y1="140" x2="340" y2="140" stroke="#555" stroke-width="1.6"/><text x="30" y="174" text-anchor="start" font-size="12" fill="#111">TFT SCK</text><line x1="250" y1="170" x2="340" y2="170" stroke="#555" stroke-width="1.6"/><text x="30" y="204" text-anchor="start" font-size="12" fill="#111">TFT MOSI</text><line x1="250" y1="200" x2="340" y2="200" stroke="#555" stroke-width="1.6"/><text x="30" y="226" text-anchor="start" font-size="11" fill="#666">VCC, GND, LED: see your module</text><rect x="20" y="232" width="230" height="122" rx="8" fill="#e8f5e9" stroke="#333" stroke-width="1.5"/><text x="135.0" y="252" text-anchor="middle" font-weight="bold" font-size="14">BT201 BT/SD module</text><text x="30" y="279" text-anchor="start" font-size="12" fill="#111">RX &#8592; ESP32 TX</text><line x1="250" y1="275" x2="340" y2="275" stroke="#555" stroke-width="1.6"/><text x="30" y="309" text-anchor="start" font-size="12" fill="#111">TX &#8594; ESP32 RX</text><line x1="250" y1="305" x2="340" y2="305" stroke="#555" stroke-width="1.6"/><text x="30" y="338" text-anchor="start" font-size="11" fill="#666">power, GND, SD, audio: see module</text><rect x="640" y="330" width="220" height="130" rx="8" fill="#f3e5f5" stroke="#333" stroke-width="1.5"/><text x="750.0" y="350" text-anchor="middle" font-weight="bold" font-size="14">HW-040 encoder</text><text x="650" y="389" text-anchor="start" font-size="12" fill="#111">CLK</text><line x1="530" y1="385" x2="640" y2="385" stroke="#555" stroke-width="1.6"/><text x="650" y="419" text-anchor="start" font-size="12" fill="#111">DT</text><line x1="530" y1="415" x2="640" y2="415" stroke="#555" stroke-width="1.6"/><text x="650" y="449" text-anchor="start" font-size="12" fill="#111">SW (push)</text><line x1="530" y1="445" x2="640" y2="445" stroke="#555" stroke-width="1.6"/><rect x="640" y="468" width="220" height="122" rx="8" fill="#f3e5f5" stroke="#333" stroke-width="1.5"/><text x="750.0" y="488" text-anchor="middle" font-weight="bold" font-size="14">3 push buttons</text><text x="650" y="509" text-anchor="start" font-size="12" fill="#111">PREV &#8594; GND</text><line x1="530" y1="505" x2="640" y2="505" stroke="#555" stroke-width="1.6"/><text x="650" y="539" text-anchor="start" font-size="12" fill="#111">NEXT &#8594; GND</text><line x1="530" y1="535" x2="640" y2="535" stroke="#555" stroke-width="1.6"/><text x="650" y="569" text-anchor="start" font-size="12" fill="#111">MODE &#8594; GND</text><line x1="530" y1="565" x2="640" y2="565" stroke="#555" stroke-width="1.6"/><rect x="640" y="58" width="220" height="110" rx="8" fill="#fffde7" stroke="#333" stroke-width="1.5"/><text x="750.0" y="78" text-anchor="middle" font-weight="bold" font-size="14">PAM8403 amplifier</text><text x="650" y="110" text-anchor="start" font-size="11" fill="#666">audio in &#8592; BT201 audio out</text><text x="650" y="128" text-anchor="start" font-size="11" fill="#666">5 V supply (common GND)</text><rect x="640" y="190" width="220" height="60" rx="8" fill="#fffde7" stroke="#333" stroke-width="1.5"/><text x="750.0" y="210" text-anchor="middle" font-weight="bold" font-size="14">2 x speaker</text><line x1="750" y1="168" x2="750" y2="190" stroke="#555" stroke-width="1.6"/><text x="650" y="280" text-anchor="start" font-size="11" fill="#b71c1c">2 x 1000 &#181;F caps: one VIN-GND,</text><text x="650" y="296" text-anchor="start" font-size="11" fill="#b71c1c">one at the PAM8403 supply</text><text x="30" y="400" text-anchor="start" font-size="12" fill="#111">Buttons and encoder switch: active low,</text><text x="30" y="418" text-anchor="start" font-size="12" fill="#111">internal pull-ups, other leg to GND.</text><text x="30" y="470" text-anchor="start" font-size="13" fill="#b71c1c">DRAFT: power, audio and ground are simplified.</text><text x="30" y="490" text-anchor="start" font-size="13" fill="#b71c1c">Not a complete view of the build.</text><text x="30" y="510" text-anchor="start" font-size="13" fill="#b71c1c">Check every connection against your modules.</text></svg>